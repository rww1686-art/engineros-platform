services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://engineros:engineros@db:5432/engineros
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: engineros
      POSTGRES_USER: engineros
      POSTGRES_PASSWORD: engineros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineros -d engineros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
